{% extends "base.html" %}

{% set hide_navbar = true %}

{% block title %}Sign In - Project M.I.R.A.{% endblock %}

{% block content %}
<div class="max-w-md w-full mx-auto my-12">
    <div class="bg-white rounded-2xl p-8 shadow-xl border border-slate-100 flex flex-col space-y-6">
        <div class="text-center space-y-2">
            <div class="h-12 w-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-extrabold text-2xl mx-auto shadow-lg shadow-indigo-600/30">
                M
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome to M.I.R.A.</h2>
            <p class="text-xs text-slate-500">Sign in to your enterprise iPaaS platform account.</p>
        </div>

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="admin@mira.local"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-all">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-all">
            </div>

            <button type="submit"
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/20 cursor-pointer">
                Sign In to Platform
            </button>
        </form>
    </div>
</div>
{% endblock %}
